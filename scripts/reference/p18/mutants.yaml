# Bugs injected into the golden RTL of p18 to measure how strong a testbench is.
# Each mutant replaces the text 'find' of the golden RTL by 'replace'. A good testbench FAILS on every one.
- name: "SRA as a logical shift (signed operand inside ?:)"
  find: "3'b101: if (f7b5) alu = $signed(a) >>> shamt;   // not in a ?: (that would make it unsigned)\n                    else      alu = a >> shamt;"
  replace: "3'b101: alu = f7b5 ? $signed(a) >>> shamt : a >> shamt;"
- name: "SLTU compares signed"
  find: "3'b011: alu = (a < op2) ? 32'd1 : 32'd0;"
  replace: "3'b011: alu = ($signed(a) < $signed(op2)) ? 32'd1 : 32'd0;"
- name: "BLT unsigned"
  find: "3'b100: take = ($signed(a) < $signed(b));"
  replace: "3'b100: take = (a < b);"
- name: "LB without sign extension"
  find: "3'b000:  load_val = {{24{lshift[7]}}, lshift[7:0]};"
  replace: "3'b000:  load_val = {24'd0, lshift[7:0]};"
- name: "x0 can be written"
  find: "if (rd == 5'd0) begin wen = 1'b0; wval = 32'd0; end"
  replace: ";"
- name: "JALR does not clear bit 0"
  find: "next_pc = (a + imm_i) & 32'hFFFFFFFE;"
  replace: "next_pc = (a + imm_i);"
- name: "AUIPC ignores the pc"
  find: "OP_AUIPC: begin wen = 1'b1; wval = pc + imm_u; end"
  replace: "OP_AUIPC: begin wen = 1'b1; wval = imm_u; end"
- name: "SH always to the low half"
  find: "2'b01:   wstrb = off[1] ? 4'b1100 : 4'b0011;"
  replace: "2'b01:   wstrb = 4'b0011;"
- name: "SUB also for ADDI with bit 30 set"
  find: "3'b000: alu = (is_reg && f7b5) ? a - op2 : a + op2;"
  replace: "3'b000: alu = f7b5 ? a - op2 : a + op2;"
- name: "branch offset bit 11 lost"
  find: "wire [31:0] imm_b = {{19{insn[31]}}, insn[31], insn[7], insn[30:25], insn[11:8], 1'b0};"
  replace: "wire [31:0] imm_b = {{19{insn[31]}}, insn[31], 1'b0, insn[30:25], insn[11:8], 1'b0};"
