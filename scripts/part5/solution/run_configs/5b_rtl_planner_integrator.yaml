###############################################################################
# PART 5 - RTL planner + module generators (integrator ON)
#
# The RTL is written in two levels instead of by one RTL agent:
#   1. rtl_planner      : splits the design into modules (a contract per module) and writes the
#                         top module that wires them. The plan is checked with stubs before any
#                         module is written.
#   2. module_generator : writes one module at a time from its contract; every module is checked
#                         alone (header, compile, Yosys lint, the planner's Python model).
#   3. rtl_integrator   : OPTIONAL (like the validators). When enabled it decides which module(s)
#                         must change when the integrated design fails the testbench.
# The testbench contains ONLY the examples of the YAML spec (flow.tb_mode: examples): the tb_generator
# agent converts them into test vectors, a template writes the testbench. OPTIONAL extra tests: enable the
# reference_model agent below (a Python black-box model of the design computes the expected values).
# Then the flow is the same as Part 3: testbench simulation, Yosys, config.mk, OpenROAD, PPA score
# + iterative optimization and resynthesis (resynthesis goes to the planner).
#
# Run (from the problem/ or solution/ folder):
#   python3 asic_autonomous_flow.py --config run_configs/5b_rtl_planner_integrator.yaml
#   python3 asic_autonomous_flow.py --config run_configs/5b_rtl_planner_integrator.yaml --design p7.yaml
#   ... --agent-profile rtl_planner=claude-sonnet-5-5      (a stronger model for the planner)
#
# Models / API keys : configs/<agent>/config.yaml  (profiles)
# Prompts           : configs/<agent>/Agent.md     (instructions, rules, feedback)
# Outputs           : runs/5b_rtl_planner_integrator/   (results/<design>/rtl_gen_flow/plan/ and modules/)
###############################################################################

# --- AGENTS ---------------------------------------------------------------------
agents:
  mode: "multi"                 # single: ONE agent for the whole flow | multi: one agent per step
  agents_dir: "./configs"
  default_profile: null          # null: every agent uses the active_profile of its config.yaml (gemini_lite)

  # profile: a profile name from configs/<agent>/config.yaml (null = its active_profile)
  single_agent:
    profile: null
  tb_generator:
    profile: null
  tb_validator:
    enabled: false
    profile: null
  sdc_generator:
    profile: null
  rtl_generator:
    profile: null
  rtl_validator:
    enabled: false
    profile: null
  config_mk_generator:
    profile: null
  mipro_teacher:
    enabled: false
    profile: null

  # Part 5
  reference_model:               # OPTIONAL: Python black-box model of the design -> extra tests (default off)
    enabled: false
    profile: null
  rtl_planner:                   # splits the design into modules + writes the top module
    profile: null
  module_generator:              # writes one module at a time from its contract
    profile: null
  rtl_integrator:                # optional: decides who fixes a failing integration
    enabled: true
    profile: null

# --- DESIGN ---------------------------------------------------------------------
design:
  design: "p8.yaml"                              # Spec in ../designs/ (or use --design pX.yaml)
  orfs_platform: "sky130hd"
  pdk_rtl_path: "./PDK_files/"
  orfs_dir: "/home/OpenROAD-flow-scripts/"       # null: auto-detected from 'openroad' in PATH

# --- FLOW -----------------------------------------------------------------------
flow:
  # classic: ONE rtl_generator writes the whole RTL (Part 3)
  # planner: rtl_planner -> module_generator (-> rtl_integrator)
  rtl_mode: "planner"
  # agent   : the TB agent writes the whole testbench, with more test cases (Parts 2 and 3)
  # examples: the testbench contains ONLY the examples of the YAML spec (default)
  tb_mode: "examples"
  verification_mode: "RTL"          # RTL | BOTH (adds post-synthesis gate-level simulation)
  skip_rtl_validator: false
  rtl_gen_dspy_mode: "Simple Run"
  rtl_train_designs: ["p1.yaml", "p5.yaml", "p7.yaml"]
  optimized_rtl_flow_path: "./runs/optimized_rtl_generator.json"

  # true : keep tuning config.mk after a successful physical flow until score >= score_threshold
  # false: stop at the first successful physical flow
  iterative_optimization: true
  score_threshold: 92.0

  # true : regenerate the RTL when timing fails by far (WNS < -0.5 ns)
  # false: keep the RTL, only config.mk can recover timing
  enable_resynthesis: true
  max_resynthesis_attempts: 3

# --- RTL PLANNER (flow.rtl_mode: planner) ---------------------------------------
planner:
  max_plan_iters: 3            # attempts to get a valid plan (each plan is checked with stubs, no module written yet)
  max_module_iters: 3          # attempts per module to pass its OWN checks (header, compile, lint, Python model)
  max_modules: 8               # upper limit for the number of planned modules
  unit_models: true            # check combinational modules with the planner's Python models (random inputs)
  candidates: 1                # independent versions per module attempt; the best one (own checks) wins

  # Who gets a failure of the INTEGRATED design that no tool can point to (testbench mismatch,
  # gate-level mismatch)? Errors that name a module (compile, Yosys) always go to that module only.
  # With rtl_integrator enabled the integrator decides; otherwise:
  #   all     : every module generator gets the log (each keeps its module if it is not the cause)
  #   planner : the planner gets it and makes a new plan
  sim_failure_feedback: "all"
  replan_after_failures: 3     # with "all": after this many testbench failures in a row, the planner replans
  max_replans: 2               # new plans after the first accepted one (resynthesis replans not counted)

# --- REFERENCE MODEL (only when agents.reference_model.enabled: true) ---------
reference_model:
  max_iters: 5                 # attempts to get a model that runs and reproduces the spec's examples
                               # (if it never does, the run goes on with the spec's examples only)

# --- ITERATIONS -----------------------------------------------------------------
iterations:
  max_tb_gen_iters: 10
  max_rtl_gen_iters: 10
  max_sdc_gen_iters: 10
  max_physical_iters: 10
  max_single_agent_iters: 10

# --- OVERRIDES (multi mode only): use a file and skip that stage ---------------
overrides:
  tb_path: null
  sdc_path: null
  rtl_path: null
  config_path: null

# --- PATHS ----------------------------------------------------------------------
paths:
  evaluation_dir: "../evaluation/"
  designs_dir: "../designs/"
  results_dir: "./runs/5b_rtl_planner_integrator/results"         # + /<design>: every iteration of every flow
  solutions_dir: "./runs/5b_rtl_planner_integrator/solution"      # + /<design>: best 6_final.odb / .sdc / RTL
  config_template: "./templates/config.mk"
  sdc_comb_template: "./templates/constraint_comb.sdc"
  sdc_seq_template: "./templates/constraint_seq.sdc"
  log_file: "./runs/5b_rtl_planner_integrator/asic_autonomous_flow.log"
