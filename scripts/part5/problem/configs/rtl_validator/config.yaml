# Model profile of the RTL Validator (RTL audit) - enable it in AGENT_CONFIGS of main.py
# Select which profile to use: ollama | groq | gemini_lite | gemini_preview | openai | claude | <other_api_model>
active_profile: "gemini_lite"

profiles:
  ollama-llama3.1:
    model: "ollama_chat/llama3.1"
    engine: "litellm"
    api_base: "http://localhost:11434"
    api_key: ""
    temperature: 0.0
    cache: true # true stores the prompts - answers to save computation and tokens #

  ollama-qwen2.5-coder:
    model: "ollama_chat/qwen2.5-coder:7b"
    engine: "litellm"
    api_base: "http://localhost:11434"
    api_key: ""
    temperature: 0.0
    cache: false

  groq:
    model: "groq/allam-2-7b"
    api_key: "$GROQ_API_KEY"
    temperature: 0.0
    cache: true

  gemini_lite:
    model: "gemini/gemini-3.1-flash-lite"
    api_key: "$GEMINI_API_KEY"
    cache: true

  gemini_preview:
    model: "gemini/gemini-3-flash-preview"
    api_key: "$GEMINI_API_KEY"
    cache: true

  openai:
    model: "openai/gpt-4o-mini"
    api_key: "$OPENAI_API_KEY"
    temperature: 0.0
    cache: true

  claude-haiku-4-5:
    model: "anthropic/claude-haiku-4-5-20251001"
    api_key: "$ANTHROPIC_API_KEY"
    temperature: 0.0
    cache: true

  claude-sonnet-5-5:
    model: "anthropic/claude-sonnet-5-5"
    api_key: "$ANTHROPIC_API_KEY"
    temperature: 1
    cache: true
  
  claude-opus-5-5:
    model: "anthropic/claude-opus-5-5"
    api_key: "$ANTHROPIC_API_KEY"
    temperature: 1
    cache: true

  # add any other model and API you want! #